<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WiFi Priority Manager</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top App Bar -->
    <header class="top-bar">
      <div class="top-bar-title-group">
        <div class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M12 4.5C7.3 4.5 3.1 6.4 0 9.4l2.4 2.4C4.9 9.4 8.3 7.9 12 7.9s7.1 1.5 9.6 3.9L24 9.4C20.9 6.4 16.7 4.5 12 4.5zm0 6.8c-2.8 0-5.4 1.1-7.3 3l2.4 2.4c1.3-1.2 3-2 4.9-2s3.6.8 4.9 2l2.4-2.4c-1.9-1.9-4.5-3-7.3-3zm0 6.7c-1 0-1.9.4-2.5 1.1L12 21.6l2.5-2.5c-.6-.7-1.5-1.1-2.5-1.1z"/>
          </svg>
        </div>
        <div>
          <h1 class="top-title">WiFi Priority</h1>
          <div class="top-subtitle">
            <span id="env-badge" class="badge badge-neutral">检测运行环境...</span>
            <span class="version-text">v1.0.0</span>
          </div>
        </div>
      </div>
      <button id="btn-refresh" class="icon-btn" type="button" title="刷新状态" aria-label="刷新状态">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </header>

    <main class="content">
      <!-- Current WiFi & Daemon Status Card -->
      <section class="card hero-card" aria-label="当前连接状态">
        <div class="hero-top">
          <div class="hero-wifi-meta">
            <span class="eyebrow">当前网络状态</span>
            <h2 id="status-ssid" class="hero-ssid">加载中...</h2>
            <p id="status-detail" class="hero-sub">正在查询 WiFi 与守护进程状态</p>
          </div>
          <div id="daemon-pill" class="status-pill pill-off">
            <span class="dot"></span>
            <span id="daemon-pill-text">守护未运行</span>
          </div>
        </div>

        <div class="chip-row" id="status-chips">
          <span class="info-chip" id="chip-rssi">信号: --</span>
          <span class="info-chip" id="chip-band">频段: --</span>
          <span class="info-chip" id="chip-ip">IP: --</span>
        </div>

        <div class="hero-actions">
          <button id="btn-enforce" class="btn btn-filled" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
            </svg>
            <span>立即检测并执行</span>
          </button>
          <button id="btn-daemon-toggle" class="btn btn-tonal" type="button">
            <span id="btn-daemon-label">重启守护</span>
          </button>
        </div>
      </section>

      <!-- Global Strategy Card -->
      <section class="card" aria-label="全局调度策略">
        <div class="card-header">
          <h3 class="card-title">全局调度策略</h3>
        </div>

        <label class="switch-row" for="cfg-enabled">
          <div class="switch-text">
            <span class="switch-title">启用 WiFi 优先级守护</span>
            <span class="switch-desc">关闭后守护进程将停止干预系统 WiFi 连接</span>
          </div>
          <span class="md-switch">
            <input id="cfg-enabled" type="checkbox" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <div class="divider"></div>

        <label class="switch-row" for="cfg-preempt">
          <div class="switch-text">
            <span class="switch-title">高优 WiFi 主动抢占</span>
            <span class="switch-desc">开启后，即使已连接低顺位 WiFi，检测到高顺位 WiFi 信号达标时也将主动切换</span>
          </div>
          <span class="md-switch">
            <input id="cfg-preempt" type="checkbox" checked />
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <div class="divider"></div>

        <div class="tuning-grid">
          <div class="field-box">
            <label class="field-label" for="cfg-interval">检测周期 (秒)</label>
            <input id="cfg-interval" class="md-input" type="number" min="15" max="300" step="5" value="30" />
            <span class="field-hint">范围 15–300 秒</span>
          </div>
          <div class="field-box">
            <label class="field-label" for="cfg-rssi">最低信号阈值 (dBm)</label>
            <input id="cfg-rssi" class="md-input" type="number" min="-95" max="-30" step="1" value="-78" />
            <span class="field-hint">高于此值才触发切换</span>
          </div>
          <div class="field-box">
            <label class="field-label" for="cfg-cooldown">切换冷却 (秒)</label>
            <input id="cfg-cooldown" class="md-input" type="number" min="10" max="300" step="5" value="45" />
            <span class="field-hint">防边缘信号乒乓抖动</span>
          </div>
        </div>
      </section>

      <!-- Priority Queue Card -->
      <section class="card" aria-label="常驻 WiFi 优先级队列">
        <div class="card-header">
          <div>
            <h3 class="card-title">常驻 WiFi 优先级队列</h3>
            <p class="card-subtitle">按 #1 → #2 → #3 顺位扫描匹配；全部不在场时停止干预</p>
          </div>
          <span id="queue-count-badge" class="badge badge-primary">0 项</span>
        </div>

        <div id="priority-list" class="queue-list"></div>

        <div id="empty-state" class="empty-state hidden">
          <p class="empty-title">暂无常驻 WiFi</p>
          <p class="empty-desc">点击下方按钮添加住所或常用的优先 WiFi</p>
        </div>

        <button id="btn-open-add" class="btn btn-outlined full-width" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>添加常驻 WiFi</span>
        </button>
      </section>

      <!-- Logs Card -->
      <section class="card" aria-label="运行日志">
        <div class="card-header">
          <div>
            <h3 class="card-title">运行日志</h3>
            <p class="card-subtitle">守护进程扫描与切换记录</p>
          </div>
          <div class="inline-actions">
            <button id="btn-logs-refresh" class="btn btn-text" type="button">刷新</button>
            <button id="btn-logs-clear" class="btn btn-text btn-danger-text" type="button">清空</button>
          </div>
        </div>
        <pre id="logs-box" class="logs-box">暂无日志</pre>
      </section>
    </main>

    <!-- Sticky Save Action Bar -->
    <footer class="save-bar">
      <div class="save-bar-inner">
        <div class="save-status-wrap">
          <span id="dirty-dot" class="dirty-dot hidden"></span>
          <span id="save-hint" class="save-hint">配置已同步</span>
        </div>
        <button id="btn-save" class="btn btn-filled" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
          </svg>
          <span>保存配置</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Add WiFi Modal / Bottom Sheet -->
  <div id="add-modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <h3 id="add-modal-title" class="sheet-title">添加常驻 WiFi</h3>

      <div id="select-field-box" class="field-box">
        <label class="field-label" for="add-wifi-select">请选择要常驻连接的 WiFi</label>
        <select id="add-wifi-select" class="md-select"></select>
        <span id="select-helper" class="field-hint">从系统已保存网络选择，或在最底部选择手动输入</span>
      </div>

      <div id="manual-fields" class="manual-fields hidden">
        <div class="field-box">
          <label class="field-label" for="manual-ssid">SSID 名称</label>
          <input id="manual-ssid" class="md-input" type="text" maxlength="64" placeholder="例如: Home_WiFi_5G" autocomplete="off" />
        </div>

        <div class="field-box">
          <label class="field-label" for="manual-security">加密方式</label>
          <select id="manual-security" class="md-select">
            <option value="wpa2" selected>WPA2-PSK</option>
            <option value="wpa3">WPA3-SAE</option>
            <option value="open">Open (无密码)</option>
            <option value="owe">OWE (增强开放)</option>
          </select>
        </div>

        <div id="manual-password-group" class="field-box">
          <label class="field-label" for="manual-password">WiFi 密码</label>
          <div class="password-wrap">
            <input id="manual-password" class="md-input" type="password" maxlength="128" placeholder="输入 WiFi 密码" autocomplete="new-password" />
            <button id="btn-toggle-pw" class="icon-btn pw-toggle" type="button" aria-label="显示或隐藏密码">
              <svg id="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="sheet-actions">
        <button id="btn-add-cancel" class="btn btn-text" type="button">取消</button>
        <button id="btn-add-confirm" class="btn btn-filled" type="button">添加到队列</button>
      </div>
    </div>
  </div>

  <!-- MD3 Snackbar -->
  <div id="snackbar" class="snackbar hidden" role="status" aria-live="polite"></div>

  <script src="./js/state.js"></script>
  <script src="./js/bridge.js"></script>
  <script src="./js/render.js"></script>
  <script src="./js/modal.js"></script>
  <script src="./js/actions.js"></script>
  <script src="./app.js"></script>
</body>
</html>
